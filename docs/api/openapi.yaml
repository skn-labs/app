openapi: 3.1.0
info:
  title: SKN API
  version: 1.0.0-hackathon
  description: |
    React 모바일 앱과 Spring Boot API가 실제로 사용하는 계약이다.
    인증은 발급 후 30일에 만료되는 단일 액세스 토큰을 HttpOnly 쿠키로 사용하고 OpenAI API 키는 서버에서만 읽는다.
servers:
  - url: /api/v1
security:
  - accessTokenCookie: []
tags:
  - { name: Auth, description: 간단 계정과 30일 액세스 토큰 }
  - { name: Home, description: 현재 경험 중심 홈 }
  - { name: Catalog, description: 제품 카탈로그와 출처가 구분된 사용 가이드 }
  - { name: Collection, description: 내 화장품 }
  - { name: Routines, description: 실제 사용 조합과 순서 }
  - { name: Experiences, description: 사용 기간과 경험 기록 }
  - { name: Notifications, description: 회고와 도메인 행동을 회수하는 앱 안 알림 }
  - { name: Patterns, description: 연결된 개인 경험 패턴 }
  - { name: AI, description: 공통 AI 채팅과 Rescue }
  - { name: Demo, description: 해커톤 시연 상태 }

paths:
  /auth/signup:
    post:
      tags: [Auth]
      security: []
      summary: 아이디와 비밀번호로 가입하고 30일 액세스 토큰을 발급한다
      operationId: signUp
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignUpRequest' }
      responses:
        '201': { description: 가입됨, content: { application/json: { schema: { $ref: '#/components/schemas/Auth' } } } }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: 아이디와 비밀번호로 로그인한다
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { description: 로그인됨, content: { application/json: { schema: { $ref: '#/components/schemas/Auth' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /auth/demo:
    post:
      tags: [Auth, Demo]
      security: []
      summary: 기록이 채워진 시연 계정으로 들어간다
      operationId: enterDemo
      responses:
        '200': { description: 데모 액세스 토큰 발급, content: { application/json: { schema: { $ref: '#/components/schemas/Auth' } } } }
  /auth/quick-accounts:
    get:
      tags: [Auth, Demo]
      security: []
      summary: 테스트 하니스에서 바로 접속할 계정을 조회한다
      description: TEST_HARNESS_ENABLED=true인 시연 환경에서만 제공한다. 회원가입한 일반 계정도 자동으로 포함된다.
      operationId: listQuickAccounts
      responses:
        '200': { description: 빠른 로그인 계정, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/QuickAccount' } } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /auth/quick-login/{username}:
    post:
      tags: [Auth, Demo]
      security: []
      summary: 테스트 계정의 액세스 토큰으로 바꾼다
      description: TEST_HARNESS_ENABLED=true인 시연 환경에서만 제공하며, 데모 계정은 별도 데모 진입 API를 사용한다.
      operationId: quickLogin
      parameters:
        - { name: username, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9_]{4,24}$' } }
      responses:
        '200': { description: 계정 전환됨, content: { application/json: { schema: { $ref: '#/components/schemas/Auth' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /auth/me:
    get:
      tags: [Auth]
      summary: 현재 액세스 토큰의 계정을 조회한다
      operationId: getMe
      responses:
        '200': { description: 현재 계정, content: { application/json: { schema: { $ref: '#/components/schemas/Auth' } } } }
        '401': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Auth]
      summary: 현재 계정과 연결된 개인 기록을 삭제한다
      operationId: deleteAccount
      responses:
        '204': { description: 삭제됨 }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: 현재 액세스 토큰을 폐기한다
      operationId: logout
      responses:
        '204': { description: 로그아웃됨 }
  /auth/onboarding:
    post:
      tags: [Auth]
      summary: 8단계 자기보고 피부 프로필을 저장하고 온보딩을 마친다
      description: sktn-prototype_2의 연령대·성별·피부 타입·최근 상태·고민·사용감·기피·시도 빈도를 한 번에 저장한다.
      operationId: completeOnboarding
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteOnboardingRequest' }
      responses:
        '200': { description: 온보딩 완료, content: { application/json: { schema: { $ref: '#/components/schemas/OnboardingResult' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /me/skin-profile:
    get:
      tags: [Auth]
      summary: 온보딩에서 직접 입력한 피부 프로필을 조회한다
      operationId: getSkinProfile
      responses:
        '200': { description: 자기보고 피부 프로필, content: { application/json: { schema: { $ref: '#/components/schemas/SkinProfile' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [Auth]
      summary: 자기보고 피부 프로필을 통째로 바꾼다
      operationId: replaceSkinProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkinProfile' }
      responses:
        '200': { description: 저장됨, content: { application/json: { schema: { $ref: '#/components/schemas/SkinProfile' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
  /home:
    get:
      tags: [Home]
      summary: 현재 경험과 최근 개인 패턴을 조회한다
      operationId: getHome
      responses:
        '200': { description: 홈, content: { application/json: { schema: { $ref: '#/components/schemas/Home' } } } }
        '401': { $ref: '#/components/responses/Problem' }
  /me/notifications:
    get:
      tags: [Notifications]
      summary: 지금 도착했고 미뤄지지 않은 내 앱 안 알림을 조회한다
      description: 회고 due와 별도로 저장된 전달 상태를 반환한다. 완료된 알림도 읽은 이력으로 목록에 남는다.
      operationId: listNotifications
      responses:
        '200': { description: 알림함, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationInbox' } } } }
        '401': { $ref: '#/components/responses/Problem' }
  /me/notifications/read-all:
    post:
      tags: [Notifications]
      summary: 현재 도착한 알림을 모두 읽음 처리한다
      operationId: readAllNotifications
      responses:
        '200': { description: 읽음 처리됨, content: { application/json: { schema: { $ref: '#/components/schemas/ApiMessage' } } } }
        '401': { $ref: '#/components/responses/Problem' }
  /me/notifications/{notificationId}/read:
    post:
      tags: [Notifications]
      summary: 알림 하나를 읽음 처리한다
      operationId: readNotification
      parameters: [ { $ref: '#/components/parameters/NotificationId' } ]
      responses:
        '200': { description: 읽음 처리된 알림, content: { application/json: { schema: { $ref: '#/components/schemas/Notification' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /me/notifications/{notificationId}/snooze:
    post:
      tags: [Notifications]
      summary: 완료되지 않은 알림을 지정한 시간만큼 미룬다
      operationId: snoozeNotification
      parameters: [ { $ref: '#/components/parameters/NotificationId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SnoozeNotificationRequest' }
      responses:
        '200': { description: 미뤄진 알림, content: { application/json: { schema: { $ref: '#/components/schemas/Notification' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /products:
    get:
      tags: [Catalog]
      summary: 브랜드·제품명·종류로 제품을 커서 검색한다
      description: 검색어가 없으면 관리하는 인기 휴리스틱으로 대표 제품을 먼저 반환하고, 검색 중에는 이름·브랜드·종류의 적합도를 먼저 적용한다. 내 화장품은 이 목록과 별도로 추가 최신순이다. 이 순서는 적합성·안전성·효능 추천을 뜻하지 않는다. nextCursor는 클라이언트가 해석하지 않고 다음 요청에 그대로 보낸다.
      operationId: searchProducts
      parameters:
        - { name: query, in: query, schema: { type: string, maxLength: 100, default: '' } }
        - { name: cursor, in: query, schema: { type: [string, 'null'] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 24 } }
      responses:
        '200': { description: 검색 결과 한 페이지, content: { application/json: { schema: { $ref: '#/components/schemas/ProductPage' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /products/{productId}:
    get:
      tags: [Catalog]
      summary: 확인된 제품 정보를 조회한다
      operationId: getProduct
      parameters: [ { $ref: '#/components/parameters/ProductId' } ]
      responses:
        '200': { description: 제품, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /me/preferences:
    get:
      tags: [Auth]
      summary: 선택적으로 받은 사용감 선호를 조회한다
      description: 저장한 적이 없으면 빈 목록과 빈 메모를 돌려준다.
      operationId: getPreferences
      responses:
        '200': { description: 사용감 선호, content: { application/json: { schema: { $ref: '#/components/schemas/Preference' } } } }
        '401': { $ref: '#/components/responses/Problem' }
    put:
      tags: [Auth]
      summary: 사용감 선호를 통째로 바꾼다
      operationId: replacePreferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Preference' }
      responses:
        '200': { description: 저장됨, content: { application/json: { schema: { $ref: '#/components/schemas/Preference' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /me/products:
    get:
      tags: [Collection]
      summary: 내 화장품을 조회한다
      operationId: listMyProducts
      responses:
        '200': { description: 내 화장품, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/UserProduct' } } } } }
    post:
      tags: [Collection]
      summary: 카탈로그 제품 또는 직접 입력 제품을 담는다
      operationId: addMyProduct
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddUserProductRequest' }
      responses:
        '201': { description: 담김, content: { application/json: { schema: { $ref: '#/components/schemas/UserProduct' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /me/products/{userProductId}:
    get:
      tags: [Collection]
      summary: 내 화장품 하나를 조회한다
      operationId: getMyProduct
      parameters: [ { $ref: '#/components/parameters/UserProductId' } ]
      responses:
        '200': { description: 내 화장품, content: { application/json: { schema: { $ref: '#/components/schemas/UserProduct' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /me/routines:
    get:
      tags: [Routines]
      summary: 저장한 모든 루틴 버전을 조회한다
      description: 현재 루틴을 먼저 보여주고, 보존된 비교 기준과 과거 루틴을 생성 역순으로 반환한다.
      operationId: listRoutines
      responses:
        '200':
          description: 루틴 아카이브
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Routine' }
  /me/routines/current:
    get:
      tags: [Routines]
      summary: 현재 실제 사용 루틴을 조회한다
      operationId: getCurrentRoutine
      responses:
        '200': { description: 현재 루틴, content: { application/json: { schema: { $ref: '#/components/schemas/Routine' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [Routines]
      summary: 제품과 순서를 저장하고 새 사용 경험을 시작한다
      operationId: replaceCurrentRoutine
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRoutineRequest' }
      responses:
        '200': { description: 새 루틴 경험, content: { application/json: { schema: { $ref: '#/components/schemas/Experience' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /me/routines/{routineId}:
    get:
      tags: [Routines]
      summary: 저장된 루틴 버전 하나의 구성을 조회한다
      operationId: getRoutine
      parameters: [ { $ref: '#/components/parameters/RoutineId' } ]
      responses:
        '200': { description: 루틴 구성, content: { application/json: { schema: { $ref: '#/components/schemas/Routine' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /me/routines/{routineId}/name-suggestion:
    post:
      tags: [Routines]
      summary: 루틴 이름과 개인 데이터 기반 AI 문장을 준비한다
      description: 제품 종류·순서·시간·빈도로 이름을 제안하고, 관련 개인 기록과 자기보고 선호가 있으면 이 루틴이 사용 경험에 어떤 도움을 줄지 짧은 한 문장으로 생성해 저장된 루틴 버전에 연결한다. AI 실패 시에도 서버가 구성 기반 기본 이름을 반환하며 루틴 저장이나 이름 적용을 막지 않는다.
      operationId: suggestRoutineName
      parameters: [ { $ref: '#/components/parameters/RoutineId' } ]
      responses:
        '200': { description: 이름 제안, content: { application/json: { schema: { $ref: '#/components/schemas/RoutineNameSuggestion' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /me/routines/{routineId}/name:
    put:
      tags: [Routines]
      summary: 사용자가 확인한 이름을 현재 루틴과 진행 중인 경험에 적용한다
      operationId: renameCurrentRoutine
      parameters: [ { $ref: '#/components/parameters/RoutineId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenameRoutineRequest' }
      responses:
        '200': { description: 이름이 반영된 루틴, content: { application/json: { schema: { $ref: '#/components/schemas/Routine' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /me/routines/{routineId}/insight:
    post:
      tags: [Routines]
      summary: 저장된 루틴의 개인 데이터 기반 AI 도움 문장을 준비한다
      description: 이미 생성된 문장이 있으면 그대로 반환하고, 없으면 관련 개인 기록과 자기보고 선호에서 생성해 해당 루틴 버전에 저장한다. 루틴의 제품·순서·이름은 바꾸지 않는다.
      operationId: generateRoutineInsight
      parameters: [ { $ref: '#/components/parameters/RoutineId' } ]
      responses:
        '200': { description: 읽기 전용 루틴 AI 문장, content: { application/json: { schema: { $ref: '#/components/schemas/RoutineInsight' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /me/routines/baseline:
    get:
      tags: [Routines]
      summary: Rescue 비교에 쓰는 마지막 문제없던 루틴을 조회한다
      operationId: getBaselineRoutine
      responses:
        '200': { description: 비교 기준 루틴, content: { application/json: { schema: { $ref: '#/components/schemas/Routine' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /me/experiences/current:
    get:
      tags: [Experiences]
      summary: 현재 사용 중인 경험을 조회한다
      operationId: getCurrentExperience
      responses:
        '200': { description: 현재 경험, content: { application/json: { schema: { $ref: '#/components/schemas/Experience' } } } }
        '204': { description: 현재 경험 없음 }
  /me/experiences:
    post:
      tags: [Experiences]
      summary: 제품 하나 또는 현재 루틴에 제품을 더한 경험을 시작한다
      operationId: startExperience
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartExperienceRequest' }
      responses:
        '201': { description: 시작됨, content: { application/json: { schema: { $ref: '#/components/schemas/Experience' } } } }
  /me/experiences/{experienceId}:
    get:
      tags: [Experiences]
      summary: 사용 경험을 조회한다
      operationId: getExperience
      parameters: [ { $ref: '#/components/parameters/ExperienceId' } ]
      responses:
        '200': { description: 경험, content: { application/json: { schema: { $ref: '#/components/schemas/Experience' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /me/experiences/{experienceId}/records:
    post:
      tags: [Experiences]
      summary: 지금 또는 7일 시점의 사용 경험을 남긴다
      operationId: recordExperience
      parameters: [ { $ref: '#/components/parameters/ExperienceId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordExperienceRequest' }
      responses:
        '201': { description: 기록됨, content: { application/json: { schema: { $ref: '#/components/schemas/SavedExperienceRecord' } } } }
  /me/experiences/{experienceId}/complete:
    post:
      tags: [Experiences]
      summary: 7일 전이라도 현재 경험을 마친다
      operationId: completeExperience
      parameters: [ { $ref: '#/components/parameters/ExperienceId' } ]
      responses:
        '200': { description: 완료, content: { application/json: { schema: { $ref: '#/components/schemas/ApiMessage' } } } }
  /me/experience-records:
    get:
      tags: [Experiences]
      summary: 시간순 개인 경험 기록을 조회한다
      operationId: listExperienceRecords
      responses:
        '200': { description: 경험 기록, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ExperienceRecord' } } } } }
  /me/patterns:
    get:
      tags: [Patterns]
      summary: 개인 패턴과 근거 수를 조회한다
      operationId: listPatterns
      responses:
        '200': { description: 패턴, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Pattern' } } } } }
  /me/patterns/{patternId}:
    get:
      tags: [Patterns]
      summary: 패턴과 지지·반대 원본 기록을 조회한다
      operationId: getPattern
      parameters: [ { $ref: '#/components/parameters/PatternId' } ]
      responses:
        '200': { description: 패턴, content: { application/json: { schema: { $ref: '#/components/schemas/Pattern' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /ai/conversations:
    get:
      tags: [AI]
      summary: 내 AI 대화 목록을 조회한다
      operationId: listConversations
      responses:
        '200': { description: 대화 목록, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Conversation' } } } } }
    post:
      tags: [AI]
      summary: 공통 AI 채팅을 맥락과 초기 메시지로 시작한다
      operationId: createConversation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateConversationRequest' }
      responses:
        '201': { description: 첫 AI 답변 포함, content: { application/json: { schema: { $ref: '#/components/schemas/Conversation' } } } }
  /ai/conversations/{conversationId}:
    get:
      tags: [AI]
      summary: 대화 전체를 조회한다
      operationId: getConversation
      parameters: [ { $ref: '#/components/parameters/ConversationId' } ]
      responses:
        '200': { description: 대화, content: { application/json: { schema: { $ref: '#/components/schemas/Conversation' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /ai/conversations/{conversationId}/messages:
    post:
      tags: [AI]
      summary: 메시지를 보내고 동적 추천 입력이 포함된 AI 답변을 받는다
      operationId: sendConversationMessage
      parameters: [ { $ref: '#/components/parameters/ConversationId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendMessageRequest' }
      responses:
        '200': { description: 갱신된 대화, content: { application/json: { schema: { $ref: '#/components/schemas/Conversation' } } } }
  /ai/conversations/{conversationId}/rescue/apply:
    post:
      tags: [AI, Routines]
      summary: 사용자가 승인한 Rescue 루틴을 새 경험으로 적용한다
      operationId: applyRescuePlan
      parameters: [ { $ref: '#/components/parameters/ConversationId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientRequest' }
      responses:
        '200': { description: 새 독립 루틴 경험, content: { application/json: { schema: { $ref: '#/components/schemas/Experience' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /demo/reset:
    post:
      tags: [Demo]
      summary: 데모 계정만 시연 상태를 바꾼다
      operationId: resetDemo
      parameters:
        - name: scenario
          in: query
          schema: { type: string, enum: [default, empty-experience, cold-start], default: default }
      responses:
        '200': { description: 초기화됨, content: { application/json: { schema: { $ref: '#/components/schemas/ApiMessage' } } } }

components:
  securitySchemes:
    accessTokenCookie:
      type: apiKey
      in: cookie
      name: skn_access_token
      description: 발급 후 30일에 절대 만료되는 불투명 액세스 토큰. HttpOnly, SameSite=Lax이며 HTTPS에서는 Secure로 발급한다. 리프레시 토큰은 없다.
  parameters:
    ProductId: { name: productId, in: path, required: true, schema: { type: integer, format: int64 } }
    UserProductId: { name: userProductId, in: path, required: true, schema: { type: integer, format: int64 } }
    ExperienceId: { name: experienceId, in: path, required: true, schema: { type: integer, format: int64 } }
    RoutineId: { name: routineId, in: path, required: true, schema: { type: integer, format: int64 } }
    PatternId: { name: patternId, in: path, required: true, schema: { type: integer, format: int64 } }
    ConversationId: { name: conversationId, in: path, required: true, schema: { type: integer, format: int64 } }
    NotificationId: { name: notificationId, in: path, required: true, schema: { type: integer, format: int64 } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1 } }
  responses:
    Problem:
      description: RFC 9457 문제 응답
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    SignUpRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, pattern: '^[a-z0-9_]{4,24}$' }
        password: { type: string, minLength: 8, maxLength: 72, writeOnly: true }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, writeOnly: true }
    Auth:
      type: object
      required: [userId, username, displayName, demo, onboardingCompleted]
      properties:
        userId: { type: integer, format: int64 }
        username: { type: string }
        displayName: { type: string }
        demo: { type: boolean }
        onboardingCompleted: { type: boolean }
    QuickAccount:
      type: object
      required: [username, displayName]
      properties:
        username: { type: string }
        displayName: { type: string }
    CompleteOnboardingRequest:
      type: object
      required: [profile, clientRequestId]
      properties:
        profile: { $ref: '#/components/schemas/SkinProfile' }
        clientRequestId: { type: string, minLength: 1 }
    SkinProfile:
      type: object
      description: 사용자가 prototype_2의 8단계에서 직접 선택한 자기보고 맥락. AI 추론이나 진단이 아니다.
      required: [ageRange, gender, skinType, skinCondition, concerns, textures, avoids, avoidNote, trialFrequency]
      properties:
        ageRange: { type: string, enum: [10S, 20S, 30S, 40S, 50S, 60_PLUS] }
        gender: { type: string, enum: [MALE, FEMALE] }
        skinType: { type: string, enum: [DRY, OILY, COMBINATION, NORMAL, UNSURE] }
        skinCondition: { type: integer, minimum: 1, maximum: 5 }
        concerns:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string, maxLength: 40 }
        textures:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string, maxLength: 40 }
        avoids:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 40 }
        avoidNote: { type: string, maxLength: 300 }
        trialFrequency: { type: string, enum: [RARELY, EVERY_FEW_MONTHS, ONE_OR_TWO_MONTHLY, THREE_PLUS_MONTHLY] }
    Preference:
      type: object
      description: >-
        온보딩 피부 프로필과 설정에서 받는 사용감 선호. 구조화된 실제 경험보다 약한 자기보고 맥락으로 쓴다.
      required: [likes, avoids, note]
      properties:
        likes:
          type: array
          maxItems: 12
          items: { type: string, maxLength: 40 }
        avoids:
          type: array
          maxItems: 12
          items: { type: string, maxLength: 40 }
        note: { type: string, maxLength: 300 }
    OnboardingResult:
      type: object
      required: [user, profile]
      properties:
        user: { $ref: '#/components/schemas/Auth' }
        profile: { $ref: '#/components/schemas/SkinProfile' }
    Product:
      type: object
      required: [id, brand, name, category, verified, guide, facts, achievements, personalRecordCount, owned]
      properties:
        id: { type: integer, format: int64 }
        brand: { type: string }
        brandLogoUrl: { type: [string, 'null'], description: 저장소에 등록된 브랜드 로고 애셋 경로. 실제 제조 법인 정보가 아님 }
        name: { type: string }
        category: { type: string }
        volume: { type: [string, 'null'] }
        versionLabel: { type: [string, 'null'] }
        verified: { type: boolean, description: legacy 확인 flag와 source-backed fact가 모두 있을 때만 true }
        guide: { $ref: '#/components/schemas/ProductGuide' }
        facts: { type: array, items: { $ref: '#/components/schemas/ProductFact' } }
        achievements:
          type: array
          maxItems: 3
          description: 제품과 정확히 일치하고 발생 시점과 출처가 확인된 외부 성과 이력. 제품 사실·효능·안전·개인 적합성 근거가 아님
          items: { $ref: '#/components/schemas/ProductAchievement' }
        personalRecordCount: { type: integer, minimum: 0 }
        owned: { type: boolean }
        imageUrl: { type: [string, 'null'], format: uri }
    ProductGuide:
      type: object
      required: [summary, routineStep, usageType, usageTiming, usageInstructions, highlights, origin, generatedAt]
      properties:
        summary: { type: string, minLength: 1, maxLength: 500, description: 제품명과 등록 제형을 포함해 제품 종류를 설명하는 짧은 안내 }
        routineStep: { type: string, minLength: 1, maxLength: 100, description: category를 바탕으로 한 일반적인 루틴 위치 }
        usageType: { type: string, minLength: 1, maxLength: 100, description: 씻어내기·붙이기·남겨두기 등 일반 사용 형태 }
        usageTiming:
          type: array
          maxItems: 4
          items: { type: string, minLength: 1, maxLength: 100 }
        usageInstructions:
          type: array
          description: 제품 표시를 우선하도록 안내하는 일반 사용법. 출처 확인 제품 사실이 아님
          maxItems: 4
          items: { type: string, minLength: 1, maxLength: 300 }
        highlights:
          type: array
          description: 등록 제형을 첫 항목으로 포함해 제품 종류와 사용 형태를 이해하기 위한 특징 설명. 관찰·기록 과제가 아님
          maxItems: 4
          items: { $ref: '#/components/schemas/ProductHighlight' }
        origin: { type: string, enum: [AI_GENERATED, EDITORIAL] }
        generatedAt: { type: string, format: date-time }
    ProductHighlight:
      type: object
      required: [title, detail]
      properties:
        title: { type: string, minLength: 1, maxLength: 80 }
        detail: { type: string, minLength: 1, maxLength: 300 }
    ProductFact:
      type: object
      required: [type, text, sourceLabel, sourceUrl, checkedAt]
      properties:
        type:
          type: string
          enum: [DIRECTIONS, TEXTURE, LABEL_CLAIM, CAUTION, SUN_PROTECTION, INGREDIENT_LABEL, CERTIFICATION]
        text: { type: string, minLength: 1, maxLength: 500 }
        sourceLabel: { type: string, minLength: 1, maxLength: 150 }
        sourceUrl: { type: string, format: uri }
        checkedAt: { type: string, format: date-time }
    ProductAchievement:
      type: object
      required: [type, periodLabel, title, detail, sourceLabel, sourceUrl, checkedAt]
      properties:
        type: { type: string, enum: [AWARD, RANKING, MILESTONE] }
        periodLabel: { type: string, minLength: 1, maxLength: 40, description: 성과가 발생한 시점 또는 기간 }
        title: { type: string, minLength: 1, maxLength: 120 }
        detail: { type: string, minLength: 1, maxLength: 300 }
        sourceLabel: { type: string, minLength: 1, maxLength: 150 }
        sourceUrl: { type: string, format: uri }
        checkedAt: { type: string, format: date-time, description: 저장된 출처를 마지막으로 대조한 시각 }
    ProductPage:
      type: object
      required: [items, hasMore]
      properties:
        items: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/Product' } }
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }
    UserProduct:
      type: object
      required: [id, addedAt, personalRecordCount, inCurrentRoutine]
      properties:
        id: { type: integer, format: int64 }
        product: { anyOf: [ { $ref: '#/components/schemas/Product' }, { type: 'null' } ] }
        customBrand: { type: [string, 'null'], maxLength: 120 }
        brandLogoUrl: { type: [string, 'null'], description: 카탈로그 또는 정확히 일치하는 직접 입력 브랜드의 로고 애셋 경로 }
        customName: { type: [string, 'null'], maxLength: 160 }
        customCategory: { type: [string, 'null'], maxLength: 80 }
        memo: { type: [string, 'null'], maxLength: 1000 }
        addedAt: { type: string }
        personalRecordCount: { type: integer, minimum: 0 }
        inCurrentRoutine: { type: boolean }
    AddUserProductRequest:
      type: object
      description: productId 또는 customName 중 하나를 사용한다.
      properties:
        productId: { type: [integer, 'null'], format: int64 }
        customBrand: { type: [string, 'null'], maxLength: 120 }
        customName: { type: [string, 'null'], maxLength: 160 }
        customCategory: { type: [string, 'null'], maxLength: 80 }
        memo: { type: [string, 'null'], maxLength: 1000 }
    RoutineItem:
      type: object
      required: [userProductId, productName, brand, category, timeSlot, position, frequency]
      properties:
        userProductId: { type: integer, format: int64 }
        productName: { type: string }
        brand: { type: string }
        brandLogoUrl: { type: [string, 'null'] }
        category: { type: string }
        timeSlot: { type: string, enum: [MORNING, EVENING, BOTH] }
        position: { type: integer, minimum: 0 }
        frequency: { type: string }
    RoutineItemInput:
      type: object
      required: [userProductId, timeSlot, frequency]
      properties:
        userProductId: { type: integer, format: int64 }
        timeSlot: { type: string, enum: [MORNING, EVENING, BOTH] }
        frequency: { type: string, maxLength: 20 }
    Routine:
      type: object
      required: [id, name, dayPart, status, startedAt, items]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        dayPart: { type: string, enum: [MORNING, EVENING, ANYTIME] }
        status: { type: string, enum: [CURRENT, BASELINE, PAST] }
        startedAt: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/RoutineItem' } }
        insight: { $ref: '#/components/schemas/RoutineInsight' }
    RoutineInsight:
      type: object
      required: [text, keywords, generatedAt]
      properties:
        text: { type: string, minLength: 1, maxLength: 70, description: 이 루틴이 사용 경험에 어떤 도움을 줄지 개인 기록과 자기보고 선호에서 AI가 만든 읽기 전용 한 문장 }
        keywords: { type: array, minItems: 0, maxItems: 3, items: { type: string, minLength: 1, maxLength: 30 }, description: 같은 개인 맥락에서 정리한 짧은 표현 2~3개. 기존 생성분은 보강 전까지 빈 배열일 수 있음 }
        generatedAt: { type: string }
    UpdateRoutineRequest:
      type: object
      required: [name, items]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        items: { type: array, minItems: 1, maxItems: 12, items: { $ref: '#/components/schemas/RoutineItemInput' } }
    RoutineNameSuggestion:
      type: object
      required: [name, aiGenerated]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        aiGenerated: { type: boolean }
        insight: { $ref: '#/components/schemas/RoutineInsight' }
    RenameRoutineRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
    StartExperienceRequest:
      type: object
      required: [userProductId, mode, clientRequestId]
      properties:
        userProductId: { type: integer, format: int64 }
        mode: { type: string, enum: [PRODUCT, ROUTINE] }
        dayPart: { type: string, enum: [MORNING, EVENING, ANYTIME], default: EVENING }
        clientRequestId: { type: string, minLength: 1 }
    Experience:
      type: object
      required: [id, subjectType, title, subtitle, status, startedAt, reviewDueAt, day, daysUntilReview, reviewDue, recordSummary]
      properties:
        id: { type: integer, format: int64 }
        subjectType: { type: string, enum: [PRODUCT, ROUTINE] }
        routineId: { type: [integer, 'null'], format: int64 }
        userProductId: { type: [integer, 'null'], format: int64 }
        title: { type: string }
        subtitle: { type: string }
        status: { type: string, enum: [ACTIVE, COMPLETED, CANCELLED] }
        startedAt: { type: string }
        reviewDueAt: { type: string }
        day: { type: integer, minimum: 1 }
        daysUntilReview: { type: integer, minimum: 0 }
        reviewDue: { type: boolean }
        routine: { anyOf: [ { $ref: '#/components/schemas/Routine' }, { type: 'null' } ] }
        product: { anyOf: [ { $ref: '#/components/schemas/UserProduct' }, { type: 'null' } ] }
        latestRecord: { anyOf: [ { $ref: '#/components/schemas/ExperienceRecord' }, { type: 'null' } ] }
        recordSummary: { $ref: '#/components/schemas/ExperienceRecordSummary' }
    ExperienceRecordSummary:
      type: object
      description: 같은 사용 경험 기간에 누적된 개별 기록의 표시용 집계. 원본 기록을 대체하지 않는다.
      required: [totalCount, likedCount, disappointedCount, unsureCount, discomfortCount]
      properties:
        totalCount: { type: integer, minimum: 0 }
        likedCount: { type: integer, minimum: 0 }
        disappointedCount: { type: integer, minimum: 0 }
        unsureCount: { type: integer, minimum: 0 }
        discomfortCount: { type: integer, minimum: 0 }
    RecordExperienceRequest:
      type: object
      required: [sentiment, discomfort, clientRequestId]
      properties:
        sentiment: { type: string, enum: [LIKED, DISAPPOINTED, UNSURE] }
        note: { type: string, maxLength: 1200 }
        tags: { type: array, maxItems: 8, items: { type: string } }
        discomfort: { type: string, enum: [NOT_REPORTED, REPORTED, UNKNOWN] }
        adherence: { type: string, enum: [MATCHED, PARTIAL, DIFFERENT, UNKNOWN], default: MATCHED }
        clientRequestId: { type: string, minLength: 1 }
    ExperienceRecord:
      type: object
      required: [id, productName, sentiment, note, discomfort, adherence, tags, createdAt]
      properties:
        id: { type: integer, format: int64 }
        sessionId: { type: [integer, 'null'], format: int64 }
        userProductId: { type: [integer, 'null'], format: int64 }
        productName: { type: string }
        sentiment: { type: string, enum: [LIKED, DISAPPOINTED, UNSURE] }
        note: { type: string }
        discomfort: { type: string, enum: [NOT_REPORTED, REPORTED, UNKNOWN] }
        adherence: { type: string, enum: [MATCHED, PARTIAL, DIFFERENT, UNKNOWN] }
        tags: { type: array, items: { type: string } }
        createdAt: { type: string }
    SavedExperienceRecord:
      type: object
      required: [record, rescueSuggested]
      properties:
        record: { $ref: '#/components/schemas/ExperienceRecord' }
        linkedPatternId: { type: [integer, 'null'], format: int64 }
        rescueSuggested: { type: boolean }
    PatternEvidence:
      type: object
      required: [recordId, productName, note, sentiment, polarity, createdAt]
      properties:
        recordId: { type: integer, format: int64 }
        productName: { type: string }
        note: { type: string }
        sentiment: { type: string }
        polarity: { type: string, enum: [SUPPORTS, CONTRADICTS] }
        createdAt: { type: string }
    Pattern:
      type: object
      required: [id, title, summary, confidenceNote, supportingCount, contradictingCount, evidence]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        summary: { type: string }
        confidenceNote: { type: string }
        supportingCount: { type: integer, minimum: 0 }
        contradictingCount: { type: integer, minimum: 0 }
        evidence: { type: array, items: { $ref: '#/components/schemas/PatternEvidence' } }
    Message:
      type: object
      required: [id, role, content, suggestedReplies, evidenceRefs, webSources, status, createdAt]
      properties:
        id: { type: integer, format: int64 }
        role: { type: string, enum: [USER, ASSISTANT] }
        content: { type: string, description: AI 답변은 Markdown이며 외부 사실을 사용한 문장에는 webSources와 연결된 클릭 가능한 인라인 인용이 포함된다. }
        suggestedReplies: { type: array, maxItems: 3, items: { type: string, maxLength: 80 } }
        evidenceRefs: { type: array, maxItems: 8, items: { type: string, maxLength: 64 } }
        webSources: { type: array, maxItems: 8, items: { $ref: '#/components/schemas/WebSource' } }
        status: { type: string, enum: [READY, FALLBACK, FAILED] }
        createdAt: { type: string }
    WebSource:
      type: object
      required: [ref, title, url, tier]
      properties:
        ref: { type: string, pattern: '^S-[1-9][0-9]*$', description: 한 AI 메시지 안에서만 유효한 인라인 출처 번호 }
        title: { type: string, maxLength: 180 }
        url: { type: string, format: uri, pattern: '^https://' }
        tier: { type: string, enum: [P1, P2, P3, P4], description: 'P1 제품 공식정보, P2 공공기관, P3 연구 자료, P4 보조 자료' }
    RescuePlan:
      type: object
      required: [id, title, rationale, status]
      properties:
        id: { type: integer, format: int64 }
        baseRoutineId: { type: [integer, 'null'], format: int64 }
        title: { type: string }
        rationale: { type: string }
        removeUserProductId: { type: [integer, 'null'], format: int64 }
        removeProductName: { type: [string, 'null'] }
        status: { type: string, enum: [PROPOSED, APPLIED, DECLINED, BLOCKED] }
        appliedExperienceId: { type: [integer, 'null'], format: int64 }
    Conversation:
      type: object
      description: 공통 AI 대화. 일반 대화 중 불편 표현이 확인되면 서버가 같은 대화의 mode를 RESCUE로 전환할 수 있다.
      required: [id, mode, status, messages, quickReplies, safetyBoundary]
      properties:
        id: { type: integer, format: int64 }
        mode: { type: string, enum: [GENERAL, PRODUCT, RECOMMEND, PATTERN, RESCUE] }
        productId: { type: [integer, 'null'], format: int64 }
        experienceId: { type: [integer, 'null'], format: int64 }
        status: { type: string, enum: [OPEN, CLOSED] }
        messages: { type: array, items: { $ref: '#/components/schemas/Message' } }
        quickReplies: { type: array, maxItems: 3, items: { type: string } }
        rescuePlan: { anyOf: [ { $ref: '#/components/schemas/RescuePlan' }, { type: 'null' } ] }
        safetyBoundary: { type: boolean }
    CreateConversationRequest:
      type: object
      required: [mode, initialPrompt, clientRequestId]
      properties:
        mode: { type: string, enum: [GENERAL, PRODUCT, RECOMMEND, PATTERN, RESCUE], description: 요청한 진입 맥락. initialPrompt가 명백한 불편 표현이면 응답 mode는 RESCUE로 전환될 수 있다. }
        productId: { type: [integer, 'null'], format: int64 }
        experienceId: { type: [integer, 'null'], format: int64 }
        initialPrompt: { type: string, minLength: 1, maxLength: 1500 }
        clientRequestId: { type: string, minLength: 1 }
    SendMessageRequest:
      type: object
      required: [text, clientRequestId]
      properties:
        text: { type: string, minLength: 1, maxLength: 1500 }
        clientRequestId: { type: string, minLength: 1 }
    ClientRequest:
      type: object
      required: [clientRequestId]
      properties:
        clientRequestId: { type: string, minLength: 1 }
    NotificationAction:
      type: object
      required: [type, label, href]
      properties:
        type: { type: string, enum: [RECORD_EXPERIENCE, RECORDS, PATTERN, PROFILE, EXPLORE] }
        label: { type: string }
        href: { type: string, pattern: '^/' }
    Notification:
      type: object
      description: 회고 due와 분리된 앱 안 전달 상태. readAt, snoozedUntil, completedAt은 서로 독립적이다.
      required: [id, type, title, body, createdAt, availableAt, read, completed, action]
      properties:
        id: { type: integer, format: int64 }
        type: { type: string, enum: [EXPERIENCE_CHECK_IN, EXPERIENCE_REVIEW_DUE, PROFILE_READY, PROFILE_UPDATED, PATTERN_READY, PRODUCT_DISCOVERY] }
        title: { type: string }
        body: { type: string }
        createdAt: { type: string }
        availableAt: { type: string }
        readAt: { type: [string, 'null'] }
        snoozedUntil: { type: [string, 'null'] }
        completedAt: { type: [string, 'null'] }
        read: { type: boolean }
        completed: { type: boolean }
        action: { $ref: '#/components/schemas/NotificationAction' }
    NotificationInbox:
      type: object
      required: [items, unreadCount]
      properties:
        items: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/Notification' } }
        unreadCount: { type: integer, minimum: 0 }
    SnoozeNotificationRequest:
      type: object
      required: [durationHours]
      properties:
        durationHours: { type: integer, minimum: 1, maximum: 168 }
    Home:
      type: object
      required: [displayName, patterns, productCount, recordCount, primaryAction]
      properties:
        displayName: { type: string }
        currentExperience: { anyOf: [ { $ref: '#/components/schemas/Experience' }, { type: 'null' } ] }
        patterns: { type: array, items: { $ref: '#/components/schemas/Pattern' } }
        productCount: { type: integer, minimum: 0 }
        recordCount: { type: integer, minimum: 0 }
        primaryAction: { type: string, enum: [START_EXPERIENCE, RECORD_EXPERIENCE, REVIEW_EXPERIENCE] }
    ApiMessage:
      type: object
      required: [message]
      properties: { message: { type: string } }
    Problem:
      type: object
      required: [type, title, status, detail, code, retryable]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        retryable: { type: boolean }
