spring:
  application:
    name: skn-api
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: jdbc:sqlite:${SKN_DB_PATH:./data/skn.db}?foreign_keys=on&busy_timeout=5000&journal_mode=WAL
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 4
      connection-timeout: 5000
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      # schema.sql 은 UTF-8 이다. 지정하지 않으면 JVM 플랫폼 기본 문자셋으로 읽어서
      # 한국어 Windows(MS949) 에서는 시드 문자열이 깨진 채로 들어간다.
      encoding: UTF-8
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  test-harness:
    enabled: ${TEST_HARNESS_ENABLED:false}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-5.6-luna}
    reasoning-effort: ${OPENAI_REASONING_EFFORT:low}
    connect-timeout: 3s
    read-timeout: 25s
    max-output-tokens: 1800
    web-search-enabled: ${OPENAI_WEB_SEARCH_ENABLED:true}
    web-search-context-size: ${OPENAI_WEB_SEARCH_CONTEXT_SIZE:low}

logging:
  level:
    root: INFO
    app.skn: INFO
    org.springframework.jdbc.core: WARN
