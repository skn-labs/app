spring:
  application:
    name: skn-api
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: jdbc:sqlite:${SKN_DB_PATH:./data/skn.db}?foreign_keys=on&busy_timeout=5000&journal_mode=WAL
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 4
      connection-timeout: 5000
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      # schema.sql 은 UTF-8 이다. 지정하지 않으면 JVM 플랫폼 기본 문자셋으로 읽어서
      # 한국어 Windows(MS949) 에서는 시드 문자열이 깨진 채로 들어간다.
      encoding: UTF-8
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  auth:
    # 운영은 true로 고정한다. 로컬 HTTP는 false여야 브라우저가 쿠키를 보낼 수 있다.
    secure-cookie: ${AUTH_COOKIE_SECURE:false}
  test-harness:
    enabled: ${TEST_HARNESS_ENABLED:false}
  rate-limit:
    # OpenAI 를 트리거하는 AI 대화 POST 만 보호한다. 한도는 넉넉해서 정상 사용자는 막히지 않고
    # 짧은 시간의 과도한 반복 호출만 429 로 차단된다. 인메모리라 서버 재시작 시 초기화된다.
    enabled: ${RATE_LIMIT_ENABLED:true}
    per-minute: ${RATE_LIMIT_PER_MINUTE:10}
    per-hour: ${RATE_LIMIT_PER_HOUR:60}
    per-day: ${RATE_LIMIT_PER_DAY:200}
    max-tracked-keys: ${RATE_LIMIT_MAX_TRACKED_KEYS:50000}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-5.6-terra}
    reasoning-effort: ${OPENAI_REASONING_EFFORT:low}
    connect-timeout: 3s
    read-timeout: 25s
    max-output-tokens: 1800
    web-search-enabled: ${OPENAI_WEB_SEARCH_ENABLED:true}
    web-search-context-size: ${OPENAI_WEB_SEARCH_CONTEXT_SIZE:low}

logging:
  level:
    root: INFO
    app.skn: INFO
    org.springframework.jdbc.core: WARN
