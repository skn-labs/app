spring:
  datasource:
    url: jdbc:sqlite:file:skn-test?mode=memory&cache=shared&foreign_keys=on
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

app:
  test-harness:
    enabled: true
  rate-limit:
    # 통합 테스트에서 인터셉터 경로는 그대로 타되 한도는 높게 둬서 정상 흐름을 막지 않는다.
    # 429 동작은 낮은 한도를 주입하는 전용 테스트에서 검증한다.
    enabled: true
    per-minute: 100000
    per-hour: 100000
    per-day: 100000
  openai:
    api-key: ""
    model: gpt-5.6-luna
    reasoning-effort: low
    connect-timeout: 1s
    read-timeout: 1s
    max-output-tokens: 1800
    web-search-enabled: false
    web-search-context-size: low
